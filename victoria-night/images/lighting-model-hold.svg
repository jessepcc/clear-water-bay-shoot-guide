<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">模特手持 iT32：75mm 近肩人像</title><desc id="desc">模特外侧手握灯，灯位在脸前侧约零点六米，略高于眼，相机在四至六米外。仅适合灯可藏出紧凑画框的近肩或头部构图。抽象俯视示意。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#ffc47b" stroke-width="1.5"/></marker></defs>
<rect width="640" height="480" rx="20" fill="#101e34"/>
<text x="320" y="47" text-anchor="middle" fill="#85d6f5" font-family="sans-serif" font-size="22">模特拿灯 / 75mm</text>
<path d="M42 88H598" stroke="#61bce3" stroke-width="3"/>
<text x="320" y="116" text-anchor="middle" fill="#a9b9ca" font-family="sans-serif" font-size="17">远处灯点 · 头肩紧画框</text>
<circle cx="345" cy="195" r="27" fill="#d8e6f0"/>
<path d="M345 197L333 178H357Z" fill="#172239"/>
<text x="395" y="194" fill="#f3f5f8" font-family="sans-serif" font-size="18">另一手可理发</text>
<path d="M322 215L245 276L208 277" stroke="#b4c0cf" stroke-width="6" fill="none"/>
<rect x="173" y="264" width="49" height="31" rx="6" fill="#ffbf73"/>
<path d="M218 263L322 215" stroke="#ffc47b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="48" y="327" fill="#ffcd8d" font-family="sans-serif" font-size="18">外侧手拿灯 / 约 0.6m</text>
<text x="48" y="355" fill="#a9b9ca" font-family="sans-serif" font-size="16">稍高于眼 · 从 M 1/128 起</text>
<path d="M345 230V348" stroke="#c3d1e0" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="315" y="354" width="60" height="40" rx="8" fill="#6dc9ed"/><circle cx="345" cy="374" r="12" fill="#102336"/>
<text x="394" y="376" fill="#ecf4fc" font-family="sans-serif" font-size="18">相机约 4–6m</text>
<text x="394" y="402" fill="#a9b9ca" font-family="sans-serif" font-size="15">双手持机 · 非按比例</text>
<text x="320" y="452" text-anchor="middle" fill="#a9b9ca" font-family="sans-serif" font-size="15">先检查灯和手是否入镜；不能同时给她双手自由。</text>
</svg>
