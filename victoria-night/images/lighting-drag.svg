<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">慢门闪光曝光时间示意</title><desc id="desc">一百二十五分之一秒背景较暗，八分之一秒可以记录更多灯光与运动轨迹。一次短促闪光照亮人物，环境光仍可能造成重影。</desc>
<rect width="640" height="480" rx="20" fill="#101e34"/>
<text x="320" y="55" text-anchor="middle" fill="#e7f1fb" font-family="sans-serif" font-size="24">慢门：让灯光留下动作</text>
<text x="320" y="88" text-anchor="middle" fill="#9faec3" font-family="sans-serif" font-size="16">曝光时间示意 · 不是效果照片</text>
<text x="40" y="145" fill="#e7f1fb" font-family="sans-serif" font-size="22">1/125 s</text><rect x="190" y="125" width="25" height="31" rx="5" fill="#63bde4"/>
<text x="40" y="217" fill="#e7f1fb" font-family="sans-serif" font-size="22">1/8 s</text><rect x="190" y="195" width="395" height="31" rx="5" fill="#326f95"/><rect x="190" y="195" width="10" height="31" rx="3" fill="#ffc47b"/>
<text x="218" y="247" fill="#ffcc8b" font-family="sans-serif" font-size="17">一次闪光</text><text x="450" y="247" fill="#86d6f5" font-family="sans-serif" font-size="17">环境光持续记录</text>
<path d="M50 328C120 284 190 369 256 321S374 358 440 311S532 322 585 299" fill="none" stroke="#64c9f0" stroke-width="5" opacity=".8"/>
<circle cx="322" cy="327" r="25" fill="#ffca8c"/><path d="M289 387Q291 356 322 354Q353 356 355 387" fill="#dba26e"/>
<text x="320" y="429" text-anchor="middle" fill="#e7f1fb" font-family="sans-serif" font-size="18">先固定脸，再小幅转动相机；先用前帘同步测试。</text>
<text x="320" y="457" text-anchor="middle" fill="#9faec3" font-family="sans-serif" font-size="15">闪光不能消除被环境光记录的人物重影。</text>
</svg>
