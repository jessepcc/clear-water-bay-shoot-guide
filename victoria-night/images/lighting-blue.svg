<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">摄影者手持 iT32：23mm 近距胸像</title><desc id="desc">相机距模特一点至一点五米。摄影者左手伸出灯约四十至六十厘米，右手持相机，形成前侧约二十至三十度光。抽象俯视示意，非实景。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#ffc47b" stroke-width="1.5"/></marker></defs>
<rect width="640" height="480" rx="20" fill="#101e34"/>
<text x="320" y="47" text-anchor="middle" fill="#85d6f5" font-family="sans-serif" font-size="22">摄影者拿灯 / 23mm</text>
<path d="M42 90H598" stroke="#61bce3" stroke-width="3"/>
<text x="320" y="118" text-anchor="middle" fill="#a9b9ca" font-family="sans-serif" font-size="17">港口在身后 · 抽象俯视示意</text>
<circle cx="355" cy="190" r="28" fill="#d8e6f0"/>
<path d="M355 192L343 173H367Z" fill="#172239"/>
<text x="400" y="197" fill="#f3f5f8" font-family="sans-serif" font-size="20">模特</text>
<path d="M225 331L340 220" stroke="#ffc47b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="115" y="257" fill="#ffcd8d" font-family="sans-serif" font-size="18">前侧约 20–30°</text>
<rect x="190" y="325" width="50" height="31" rx="6" fill="#ffbf73"/>
<text x="75" y="381" fill="#ffcd8d" font-family="sans-serif" font-size="17">左手：iT32 + CTO</text>
<path d="M240 347L320 371" stroke="#b4c0cf" stroke-width="5"/>
<text x="236" y="406" fill="#a9b9ca" font-family="sans-serif" font-size="16">伸出约 40–60cm</text>
<path d="M355 225V340" stroke="#c3d1e0" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="325" y="345" width="60" height="40" rx="8" fill="#6dc9ed"/><circle cx="355" cy="365" r="12" fill="#102336"/>
<text x="399" y="358" fill="#ecf4fc" font-family="sans-serif" font-size="17">右手：相机</text>
<text x="399" y="385" fill="#a9b9ca" font-family="sans-serif" font-size="16">距人 1–1.5m</text>
<text x="320" y="455" text-anchor="middle" fill="#a9b9ca" font-family="sans-serif" font-size="15">站远后角度变小；全身或双手持机时用机顶灯。</text>
</svg>
